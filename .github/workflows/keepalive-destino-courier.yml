# Supabase (plan gratis) pausa los proyectos tras 7 días sin actividad.
# Esto hace una consulta pequeña cada 3 días para que la base de datos
# de Destino Courier (login y "Mi casillero") no se vuelva a pausar.
name: Keep-alive Destino Courier

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          # Clave publicable: está hecha para ir en el navegador, no es secreta.
          SUPABASE_URL: https://yztghwhqozmtwezrabss.supabase.co
          SUPABASE_KEY: sb_publishable_RNtTq2jXKJkO5VY-1dqUDQ_CwUDfKev
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/settings?select=*&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
